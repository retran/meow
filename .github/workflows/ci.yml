name: Code Quality

on:
  push:
    branches: [ main, dev, 'retran/*' ]
  pull_request:
    branches: [ main, dev ]

jobs:
  lint-and-test:
    name: Lint and Compatibility Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install bash 3.2
        run: |
          # Install bash 3.2 for compatibility testing
          sudo apt-get update
          sudo apt-get install -y build-essential wget
          cd /tmp
          wget http://ftp.gnu.org/gnu/bash/bash-3.2.tar.gz
          tar -xzf bash-3.2.tar.gz
          cd bash-3.2
          ./configure --prefix=/usr/local/bash32
          make
          sudo make install
          sudo ln -sf /usr/local/bash32/bin/bash /usr/local/bin/bash32

      - name: Install go-task
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      - name: Install linting tools
        run: |
          sudo apt-get install -y shellcheck yamllint luarocks
          sudo luarocks install luacheck

      - name: Run shell linting
        run: task lint:shell

      - name: Run YAML linting
        run: task lint:yaml

      - name: Run Lua linting
        run: task lint:lua

      - name: Test bash 3.2 compatibility
        run: |
          echo "Testing bash 3.2 compatibility..."
          /usr/local/bin/bash32 -n bin/meowctl
          for file in lib/core/*.sh; do
            if [[ -f "$file" ]]; then
              echo "Testing syntax of $file with bash 3.2"
              /usr/local/bin/bash32 -n "$file"
            fi
          done
          echo "✓ All shell scripts are compatible with bash 3.2"
