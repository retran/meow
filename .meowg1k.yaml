# @file:    .meowg1k/config.yaml
# @brief:   Configuration file for meowg1k code generation tool settings and AI provider configuration.
# @author:  Andrew Vasilyev
# @license: MIT
#
models:
  qwen-flash:
    provider: "openrouter"
    model: "qwen/qwen3-coder-flash"
    rateLimit:
      requestsPerMinute: 60
      tokensPerMinute: 1000000
      requestsPerDay: 1000000

  qwen-plus:
    provider: "openrouter"
    model: "qwen/qwen3-coder-plus"
    rateLimit:
      requestsPerMinute: 60
      tokensPerMinute: 1000000
      requestsPerDay: 10000

profiles:
  fast:
    model: "qwen-flash"
    temperature: 0.3
    cache:
      enabled: true
      ttl: "24h"

  smart:
    model: "qwen-plus"
    timeout: "10m"
    temperature: 0.2
    topP: 0.95
    cache:
      enabled: true
      ttl: "72h"

cache:
  enabled: true
  ttl: "24h"

generate:
  default:
    profile: "fast"
    systemPrompt: >-
      You are an expert DevOps engineer and programmer specializing in shell
      scripts (Bash 3.2, POSIX) and Lua. You are familiar with dotfiles management
      on macOS, Linux, and WSL.

  tasks:
    review:
      profile: "smart"
      userPrompt: >-
        Perform a thorough code review of the following shell script or Lua code.

        Focus areas:
          - (For Shell) Bash 3.2 Compatibility, POSIX compliance, portability (GNU vs. BSD).
          - (For Lua) Correctness, idioms, performance, and potential nil errors.
          - (General) Security, error handling, readability, and maintainability.

        Output format:
          1) Summary — 2–4 bullets.
          2) Findings — numbered list with short, actionable suggestions.
          3) Quick wins — checklist of small fixes.

    doc:
      profile: "fast"
      userPrompt: >-
        Write a complete header comment block for the following script (shell or Lua).
        Requirements:
          - A short, one-line description of the script's purpose.
          - A "Usage" section explaining how to run it.
          - A "Dependencies" section listing required tools or modules.

        Do NOT include the script's code; only the comment block.

filter:
  ignore:
    - "**/*.lock"
    - "dist/**"
    - "bin/**"
    - ".git/**"
    - ".installed"
    - ".downloads"

summarize:
  default:
    profile: "fast"
    strategy:
      type: "plain"
      includeOriginalFile: false
      includeChangedFile: false
    systemPrompt: "Briefly describe the main change in the following input."
  rules:
    - match: "LICENSE"
      skip: true
    - match: "*.md"
      profile: "fast"
      strategy:
        type: "plain"
        includeOriginalFile: false
        includeChangedFile: false
      systemPrompt: "Summarize the documentation changes."

commit:
  profile: "smart"
  systemPrompt: |
    You are an expert software engineer writing a commit message in Conventional Commits format.

    Based on the file change summaries provided, create a clear and informative commit message.

    If "Developer Intent" is provided, use it to understand the purpose and context:
    - Extract GitHub issue references (like #123, #456) for footer as "Refs: #123, #456"
    - Look for breaking change indicators to add BREAKING CHANGE footer
    - Use intent to guide commit type, scope, and description

    Format:
    <type>[optional scope]: <description>

    [optional body]

    [optional footer(s)]

    Guidelines:
    - Use appropriate type: feat, fix, refactor, perf, docs, test, chore, build, ci, style
    - Keep description under 72 characters, imperative mood, no period
    - Add scope in parentheses if changes are focused on a specific area (e.g., zsh, nvim, core)
    - Include body if changes need explanation (motivation, context, impact)

    Generate only the commit message, nothing else.

pullRequest:
  profile: "smart"
  systemPrompt: |
    You are an expert software engineer creating a Pull Request description.

    Based on the file change summaries provided, create a comprehensive and actionable PR description.

    If "Developer Intent" is provided, use it to understand the purpose and context:
    - Extract the main goal to create a concise PR title.
    - Use the intent to guide the "Summary" and "Motivation" sections.
    - If GitHub issues are mentioned (e.g., #123), add them to a "Refs:" footer.
    - Note any mention of breaking changes for the "Breaking Changes" section.

    Format:
    # <Concise PR Title>

    ## Summary
    2-4 sentences explaining what this PR does and why it's valuable.

    ## Motivation
    Explain the problem or need that drove these changes.

    ## Changes
    Organized list of key changes grouped by category (e.g., Core, Refactoring, API).

    ## Technical Details
    Important implementation notes, architectural decisions, or trade-offs.

    ## Breaking Changes
    If applicable, clearly state what breaks and why. If none, state "None".

    ## Testing
    Briefly describe what testing was done to verify the changes.

    Refs: #issue-number (optional footer)

    Guidelines:
    - Be clear, concise, and actionable.
    - Focus on the "what" and "why", not the verbose "how".
    - Use technical language appropriate for developers familiar with the codebase.
    - The title should be in the imperative mood (e.g., "Add user authentication").

    Generate only the PR title and description in Markdown format, nothing else.
