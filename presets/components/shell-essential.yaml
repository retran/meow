description: >-
  Essential shell tools that can be installed on systems without GUI

depends_on:
  - components/pipx
  - components/node

homebrew:
  packages:
    - shell-essential

apt:
  packages:
    - shell-essential

apk:
  packages:
    - shell-essential

pacman:
  packages:
    - shell-essential

npm:
  packages:
    - shell-essential

symlinks:
  - git
  - tmux
  - starship
  - zsh
  - secrets
  - nvim
  - eza
  - bash
  - fd

script: setup-shell-essential.sh
