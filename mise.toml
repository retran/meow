# =============================================================================
# Linting
# =============================================================================

[tasks.lint]
description = "Run all linting checks"
depends = ["lint:shell", "lint:yaml", "lint:lua"]

[tasks."lint:shell"]
description = "Run shellcheck on all shell scripts"
run = """
echo "Running shellcheck on shell scripts..."
find . -name "*.sh" -type f -print0 | xargs -0 shellcheck
for file in bin/*; do
  if [[ -x "$file" ]] && file "$file" | grep -q -E "(shell|bash)"; then
    shellcheck "$file"
  fi
done
echo "Shell linting complete"
"""

[tasks."lint:yaml"]
description = "Run yamllint on YAML files"
run = """
echo "Running yamllint on YAML files..."
if command -v yamllint >/dev/null 2>&1; then
  find . -name "*.yaml" -o -name "*.yml" | xargs yamllint
  echo "YAML linting complete"
else
  echo "yamllint not installed, skipping YAML linting"
fi
"""

[tasks."lint:lua"]
description = "Run luacheck on Lua files"
run = """
echo "Running luacheck on Lua files..."
if command -v luacheck >/dev/null 2>&1; then
  find . -name "*.lua" -type f | xargs luacheck
  echo "Lua linting complete"
else
  echo "luacheck not installed, skipping Lua linting"
fi
"""

# =============================================================================
# Testing
# =============================================================================

[tasks."test:syntax"]
description = "Test shell script syntax with bash 3.2 compatibility"
run = """
echo "Testing shell script syntax for bash 3.2 compatibility..."
bash -n bin/meowctl
for file in lib/core/*.sh; do
  if [[ -f "$file" ]]; then
    echo "Testing syntax of $file"
    bash -n "$file"
  fi
done
echo "All shell scripts have valid syntax"
"""

[tasks."test:unit"]
description = "Run unit tests with BATS"
run = """
echo "Running unit tests..."
test/libs/bats/bin/bats test/unit/**/*.bats
echo "All unit tests passed"
"""

[tasks."test:unit:core"]
description = "Run unit tests for core library only"
run = "test/libs/bats/bin/bats test/unit/core/*.bats"

[tasks."test:unit:verbose"]
description = "Run unit tests with verbose output"
run = "test/libs/bats/bin/bats --verbose-run test/unit/**/*.bats"

[tasks.test]
description = "Run all tests (syntax + unit tests)"
depends = ["test:syntax", "test:unit"]

# =============================================================================
# Coverage
# =============================================================================

[tasks."coverage:install"]
description = "Install kcov for code coverage"
run = """
if command -v kcov >/dev/null 2>&1; then
  echo "kcov is already installed"
  exit 0
fi

echo "Installing kcov..."
if [[ "$(uname -s)" == "Darwin" ]]; then
  if command -v brew >/dev/null 2>&1; then
    brew install kcov
  else
    echo "Homebrew not found. Please install kcov manually."
    exit 1
  fi
elif [[ "$(uname -s)" == "Linux" ]]; then
  if command -v apt-get >/dev/null 2>&1; then
    sudo apt-get update && sudo apt-get install -y kcov
  elif command -v dnf >/dev/null 2>&1; then
    sudo dnf install -y kcov
  elif command -v pacman >/dev/null 2>&1; then
    sudo pacman -Sy --noconfirm kcov
  else
    echo "Unsupported package manager. Please install kcov manually."
    exit 1
  fi
else
  echo "Unsupported OS. Please install kcov manually."
  exit 1
fi
echo "kcov installed successfully"
"""

[tasks.coverage]
description = "Run tests with coverage analysis (requires kcov)"
run = """
if ! command -v kcov >/dev/null 2>&1; then
  echo "kcov is not installed. Run 'mise run coverage:install' first."
  exit 1
fi

echo "Running tests with coverage..."
mkdir -p coverage

BATS_FILES=$(find test/unit -name "*.bats" -type f)
for bats_file in $BATS_FILES; do
  echo "Testing: $bats_file"
  kcov --exclude-pattern=/test/,/usr/ coverage test/libs/bats/bin/bats "$bats_file" || true
done

echo ""
echo "Coverage report generated in coverage/"
echo "Open coverage/index.html in your browser to view the report"
"""

[tasks."coverage:report"]
description = "Open coverage report in browser"
run = """
if [[ ! -f "coverage/index.html" ]]; then
  echo "Coverage report not found. Run 'mise run coverage' first."
  exit 1
fi

if command -v open >/dev/null 2>&1; then
  open coverage/index.html
elif command -v xdg-open >/dev/null 2>&1; then
  xdg-open coverage/index.html
else
  echo "Coverage report: file://$(pwd)/coverage/index.html"
fi
"""
