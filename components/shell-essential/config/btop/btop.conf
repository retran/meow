#? Config file for btop v. 1.4.0

#* Name of a btop++/bpytop/bashtop formatted ".theme" file, "Default" and "TTY" for builtin themes.
#* Themes should be placed in "../share/btop/themes" relative to binary or in "$HOME/.config/btop/themes"
color_theme = "meow"

#* If the "meow" theme is missing, fall back gracefully to Default
#* Set to True to force a 256-color theme
force_tty = False

#* Define presets for the "P" key, ">" for key separator
presets = "cpu:1:default,proc:0:default cpu:0:default,mem:0:default,net:0:default cpu:0:default,proc:0:default"

#* Set to True to enable "h,j,k,l,g,G" keys for vim-style navigation in process list.
vim_keys = True

#* Rounded or squared corners for boxes
rounded_corners = True

#* Default symbols to use for graph creation, "braille", "block" or "tty".
graph_symbol = "braille"

# Graph symbol override for the "cpu" box
graph_symbol_cpu = "default"

# Graph symbol override for the "gpu" box
graph_symbol_gpu = "default"

# Graph symbol override for the "mem" box
graph_symbol_mem = "default"

# Graph symbol override for the "net" box
graph_symbol_net = "default"

# Graph symbol override for the "proc" box
graph_symbol_proc = "default"

#* Manually set which boxes to show. Available boxes are "cpu mem net proc" and "gpu0" through "gpu5".
shown_boxes = "cpu mem net proc"

#* Update time in milliseconds, min=100 max=86400000
update_ms = 2000

#* Processes sorting, "pid" "program" "arguments" "threads" "user" "memory" "cpu lazy" "cpu responsive"
proc_sorting = "cpu lazy"

#* Reverse sorting order, True or False.
proc_reversed = False

#* Show processes as a tree.
proc_tree = False

#* Use the cpu graph colors in the process list.
proc_colors = True

#* Use a gradient for the proc color.
proc_gradient = True

#* If process is running from the same user as btop, show detailed cpu info.
proc_per_core = True

#* Show process memory as bytes instead of percent.
proc_mem_bytes = True

#* Show cpu graph for each process.
proc_cpu_graphs = True

#* Use /proc/<pid>/smaps for memory information in the process info box (very slow)
proc_info_smaps = False

#* Show proc box on left side of screen instead of right.
proc_left = False

#* (Linux) Filter processes tied to a cpu core, list of int and/or ranges "0 1 2-3"
proc_filter_kernel = False

#* In tree-view, always accumulate child process resources in the parent process
proc_aggregate = False

#* Sets the CPU stat shown in the upper half of the cpu graph
cpu_graph_upper = "total"

#* Sets the CPU stat shown in the lower half of the cpu graph
cpu_graph_lower = "user"

#* Toggles if the lower CPU graph should be inverted.
cpu_invert_lower = True

#* Set to True to completely disable the lower CPU graph.
cpu_single_graph = False

#* Show cpu box at bottom of screen instead of top.
cpu_bottom = False

#* Numbers of maximums hottest Core temperatures to be shown in cpu box, min=0 max=6
cpu_temp_shows = 3

#* CPU temperature alarm threshold, integer value in Celsius.
cpu_temp_alarm = 85

#* Show temperatures in Fahrenheit instead of Celsius.
temp_fahrenheit = False

#* Draw a clock at top of screen, formatting according to strftime, set to "" to disable.
clock_format = ""

#* Update main ui in background when menus are showing, set this to false if the menus is flickering too much
background_update = True

#* Custom cpu model name, empty string to disable.
custom_cpu_name = ""

#* Optional filter for shown disks, list of mount points
disks_filter = ""

#* Show graphs instead of meters for memory values.
mem_graphs = True

#* Show mem box below net box instead of above.
mem_below_net = False

#* Count ZFS ARC in cached and available memory.
zfs_arc_cached = True

#* If swap is enabled, show it below the memory entries.
show_swap = True

#* Show swap as a disk, using the disk widget, instead of as a label.
swap_disk = True

#* If True, the disk widget will split statistics for ZFS and other filesystems.
show_disks = True

#* Filter out non-physical disks.
only_physical = True

#* Read disks info every x iterations.
disk_free_prct = 20

#* Show gpu info in the cpu box.
show_gpu_info = "Auto"

#* Show io mode instead of standard data view for the network
net_iface = ""

#* Set the start position for the network upload graph, default "left"
net_sync = False

#* Network traffic graphs auto rescaling.
net_auto = True

#* Sync the auto scaling for download and upload to whichever has the highest value
net_upload_direction = False

#* Start btop+ in this box when no boxes are linked to a hotkey
selected_battery = "Auto"

#* Which socket to use for lhm communication
lhm_url = ""

#* Set loglevel for "~/.config/btop/btop.log" levels are "ERROR" "WARNING" "INFO" "DEBUG"
log_level = "WARNING"
