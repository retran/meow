set -g status-style "bg=#292c3c,fg=#c6d0f5"
set -g status-left-style NONE
set -g status-right-style NONE
set -g message-style "bg=#626880,fg=#c6d0f5"
set -g message-command-style "bg=#292c3c,fg=#c6d0f5"
set -g pane-border-style "fg=#626880"
set -g pane-active-border-style "fg=#8caaee"
set -g window-status-activity-style "fg=#c6d0f5,bg=#292c3c"
set -g window-status-style "fg=#c6d0f5,bg=#292c3c"
set -g window-status-current-format "#[fg=#292c3c,bg=#8caaee,bold] #I #[fg=#c6d0f5,bg=#292c3c] #W #F "
set -g window-status-format "#[fg=#c6d0f5,bg=#292c3c] #I #[fg=#c6d0f5,bg=#292c3c] #W #F "
set -g status-left "#[fg=#292c3c,bg=#8caaee,bold] #S #[fg=#8caaee,bg=#292c3c]"
set -g status-right "#[fg=#a6d189,bg=#292c3c] %Y-%m-%d #[fg=#8caaee,bg=#292c3c]  #[fg=#292c3c,bg=#8caaee,bold] %H:%M "
set -g mode-style "fg=#a6d189,bg=#292c3c"
set -g window-status-bell-style "fg=#e78284,bg=#292c3c,bold"
