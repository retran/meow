set -g status-style "bg=#f8f5e4,fg=#5c6a72"
set -g status-left-style NONE
set -g status-right-style NONE
set -g message-style "bg=#f0f2d4,fg=#5c6a72"
set -g message-command-style "bg=#f8f5e4,fg=#5c6a72"
set -g pane-border-style "fg=#5c6a72"
set -g pane-active-border-style "fg=#3a94c5"
set -g window-status-activity-style "fg=#5c6a72,bg=#f8f5e4"
set -g window-status-style "fg=#5c6a72,bg=#f8f5e4"
set -g window-status-current-format "#[fg=#f8f5e4,bg=#3a94c5,bold] #I #[fg=#5c6a72,bg=#f8f5e4] #W #F "
set -g window-status-format "#[fg=#5c6a72,bg=#f8f5e4] #I #[fg=#5c6a72,bg=#f8f5e4] #W #F "
set -g status-left "#[fg=#f8f5e4,bg=#3a94c5,bold] #S #[fg=#3a94c5,bg=#f8f5e4]"
set -g status-right "#[fg=#8da101,bg=#f8f5e4] %Y-%m-%d #[fg=#3a94c5,bg=#f8f5e4]  #[fg=#f8f5e4,bg=#3a94c5,bold] %H:%M "
set -g mode-style "fg=#8da101,bg=#f8f5e4"
set -g window-status-bell-style "fg=#f85552,bg=#f8f5e4,bold"
