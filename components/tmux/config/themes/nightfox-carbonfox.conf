set -g status-style "bg=#161616,fg=#f2f4f8"
set -g status-left-style NONE
set -g status-right-style NONE
set -g message-style "bg=dim: "#6690d9"
base: "#78a9ff"
light: false
bright: "#8cb6ff,fg=#f2f4f8"
set -g message-command-style "bg=#161616,fg=#f2f4f8"
set -g pane-border-style "fg=#f2f4f8"
set -g pane-active-border-style "fg=dim: "#6690d9"
base: "#78a9ff"
light: false
bright: "#8cb6ff"
set -g window-status-activity-style "fg=#f2f4f8,bg=#161616"
set -g window-status-style "fg=#f2f4f8,bg=#161616"
set -g window-status-current-format "#[fg=#161616,bg=dim: "#6690d9"
base: "#78a9ff"
light: false
bright: "#8cb6ff,bold] #I #[fg=#f2f4f8,bg=#161616] #W #F "
set -g window-status-format "#[fg=#f2f4f8,bg=#161616] #I #[fg=#f2f4f8,bg=#161616] #W #F "
set -g status-left "#[fg=#161616,bg=dim: "#6690d9"
base: "#78a9ff"
light: false
bright: "#8cb6ff,bold] #S #[fg=dim: "#6690d9"
base: "#78a9ff"
light: false
bright: "#8cb6ff,bg=#161616]"
set -g status-right "#[fg=dim: "#1fa25a"
base: "#25be6a"
light: false
bright: "#46c880,bg=#161616] %Y-%m-%d #[fg=dim: "#6690d9"
base: "#78a9ff"
light: false
bright: "#8cb6ff,bg=#161616]  #[fg=#161616,bg=dim: "#6690d9"
base: "#78a9ff"
light: false
bright: "#8cb6ff,bold] %H:%M "
set -g mode-style "fg=dim: "#1fa25a"
base: "#25be6a"
light: false
bright: "#46c880,bg=#161616"
set -g window-status-bell-style "fg=dim: "#ca4780"
base: "#ee5396"
light: false
bright: "#f16da6,bg=#161616,bold"
