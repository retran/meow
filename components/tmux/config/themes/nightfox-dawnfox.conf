set -g status-style "bg=#faf4ed,fg=#575279"
set -g status-left-style NONE
set -g status-right-style NONE
set -g message-style "bg=dim: "#295e73"
base: "#286983"
light: true
bright: "#2d81a3,fg=#575279"
set -g message-command-style "bg=#faf4ed,fg=#575279"
