base: "#618774"
light: true
bright: "#629f81,bg=#faf4ed] %Y-%m-%d #[fg=dim: "#295e73"
base: "#286983"
light: true
bright: "#2d81a3,bg=#faf4ed]  #[fg=#faf4ed,bg=dim: "#295e73"
base: "#286983"
light: true
bright: "#2d81a3,bold] %H:%M "
set -g mode-style "fg=dim: "#597668"
base: "#618774"
light: true
bright: "#629f81,bg=#faf4ed"
set -g window-status-bell-style "fg=dim: "#a5576d"
base: "#b4637a"
light: true
bright: "#c26d85,bg=#faf4ed,bold"
