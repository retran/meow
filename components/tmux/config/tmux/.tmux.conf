# @file: components/tmux/config/tmux/.tmux.conf
# @brief: Comprehensive tmux configuration with enhanced productivity features
# @author: Andrew Vasilyev
# @license: MIT
#

# ============================================================================
# PLUGIN MANAGEMENT
# ============================================================================
set -g @plugin 'tmux-plugins/tpm'

# Core functionality plugins
set -g @plugin 'tmux-plugins/tmux-pain-control'        # Better pane management
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'  # Beautiful window names
set -g @plugin 'tmux-plugins/tmux-yank'                # Better copy/paste
set -g @plugin 'tmux-plugins/tmux-resurrect'           # Save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'           # Auto-save sessions

# Productivity plugins
set -g @plugin 'Morantron/tmux-fingers'                # Fast link/path copying
set -g @plugin 'tmux-plugins/tmux-open'                # Open files/URLs
set -g @plugin 'sainnhe/tmux-fzf'                      # Fuzzy finder integration

# Plugin configuration
set -g @fingers-key F                                   # Trigger: prefix + F
set -g @tmux-fzf-launch-key 'C-f'                      # Trigger: prefix + C-f
set -g @open-S 'https://www.google.com/search?q='     # Search highlighted text

# ============================================================================
# GENERAL SETTINGS
# ============================================================================
set -g mouse on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:Tc,xterm-256color:Tc,*256col*:Tc"

# RGB color support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Undercurl support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'

# Window and pane indexing
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# History and performance
set -g history-limit 50000                             # Increased from 10k to 50k
set -g focus-events on
setw -g aggressive-resize on
set -sg escape-time 0                                  # No delay (Vim-friendly)
set -g display-time 4000
set -g display-panes-time 4000
set -g repeat-time 600

# Status bar configuration
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-left-length 50
set -g status-right-length 150

# Visual notifications
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# Clipboard and mode settings
set-option -g set-clipboard on
setw -g mode-keys vi

# Window title
set-option -g set-titles on
set-option -g set-titles-string '#T'
set-option -g allow-rename off

# ============================================================================
# PREFIX KEY
# ============================================================================
set-option -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# ============================================================================
# PANE NAVIGATION (Vim-aware)
# ============================================================================
# Smart pane switching with awareness of Vim splits
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

# Seamless vim-tmux navigation with C-h/j/k/l
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Fallback navigation when prefix is pressed
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ============================================================================
# PANE MANAGEMENT
# ============================================================================
# Pane splitting with intuitive keys (retain current path)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Pane resizing (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Pane swapping
bind > swap-pane -D                                    # Swap with next pane
bind < swap-pane -U                                    # Swap with previous pane

# Pane operations
bind-key Space last-pane
bind x kill-pane
bind z resize-pane -Z
bind C-y set-window-option synchronize-panes \; display-message "Panes synchronization is now #{?pane_synchronized,on,off}"

# Advanced pane operations
bind b break-pane -d
bind J command-prompt -p "join pane from:"  "join-pane -s '%%'"
bind m command-prompt -p "Move pane to (session:window):" "move-pane -t '%%'"

# ============================================================================
# WINDOW MANAGEMENT
# ============================================================================
# New window with current path
bind c new-window -c "#{pane_current_path}"

# Window navigation
bind -n M-H previous-window
bind -n M-L next-window
bind-key Tab next-window
bind-key s last-window

# Quick window selection with Alt+number
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Move windows left/right
bind -n C-S-Left swap-window -t -1 \; select-window -t -1
bind -n C-S-Right swap-window -t +1 \; select-window -t +1

# Kill window
bind X kill-window

# Window/session browser
bind w choose-tree -sZ

# ============================================================================
# SESSION MANAGEMENT
# ============================================================================
bind C-c new-session
bind C-f command-prompt -p find-session 'switch-client -t %%'

# Session navigation
bind -n M-j switch-client -n                           # Next session
bind -n M-k switch-client -p                           # Previous session

# ============================================================================
# COPY MODE (Vi-style)
# ============================================================================
bind Enter copy-mode

# Visual selection
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# Search
bind-key -T copy-mode-vi / command-prompt -i -p "search down" "send -X search-forward-incremental \"%%%\""
bind-key -T copy-mode-vi ? command-prompt -i -p "search up" "send -X search-backward-incremental \"%%%\""
bind-key -T copy-mode-vi n send-keys -X search-again
bind-key -T copy-mode-vi N send-keys -X search-reverse

# Faster scrolling
bind -T copy-mode-vi C-u send-keys -X halfpage-up
bind -T copy-mode-vi C-d send-keys -X halfpage-down
bind -T copy-mode-vi C-b send-keys -X page-up
bind -T copy-mode-vi C-f send-keys -X page-down

# ============================================================================
# CLIPBOARD INTEGRATION
# ============================================================================
# Modern clipboard integration (tmux 2.6+)
if-shell "uname | grep -q Darwin" {
  # macOS: Use pbcopy/pbpaste directly
  bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
  bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
  bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
  bind-key p run-shell "pbpaste | tmux load-buffer - ; tmux paste-buffer"
} {
  # Linux: Use xclip
  bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
  bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
  bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
  bind-key p run-shell "xclip -out -selection clipboard | tmux load-buffer - ; tmux paste-buffer"
}

# ============================================================================
# UTILITY KEYBINDINGS
# ============================================================================
# Config reload
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Clear screen and history
bind C-l send-keys C-l \; clear-history

# Toggle status bar
bind S set-option -g status

# Lazygit popup
bind-key P display-popup -E "lazygit"

# Even layouts
bind = select-layout even-horizontal
bind + select-layout even-vertical

# Rotate panes
bind C-o rotate-window

# ============================================================================
# OTHER SETTINGS
# ============================================================================
set-option -g status-keys emacs

# ============================================================================
# THEME CONFIGURATION
# ============================================================================
# Load custom theme based on meow theme config
# This dynamically sources the generated theme file
if-shell -b "[ -f \"$HOME/.config/meow/tmux/theme.conf\" ]" "source-file \"$HOME/.config/meow/tmux/theme.conf\""

# ============================================================================
# PLUGIN INITIALIZATION
# ============================================================================
# Initialize TPM (must be at the very end)
run '~/.tmux/plugins/tpm/tpm'
