# @file: components/tmux/config/tmux/.tmux.conf
# @brief: Comprehensive tmux configuration with enhanced productivity features
# @author: Andrew Vasilyev
# @license: MIT

# ============================================================================
# PLUGINS
# ============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'Morantron/tmux-fingers'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'sainnhe/tmux-fzf'

set -g @fingers-key F
set -g @tmux-fzf-launch-key 'C-f'
set -g @open-S 'https://www.google.com/search?q='

# ============================================================================
# GENERAL
# ============================================================================
set -g mouse on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:Tc,xterm-256color:Tc,*256col*:Tc"
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g focus-events on
set -sg escape-time 0
set -g display-time 4000
set -g display-panes-time 4000
set -g repeat-time 600
setw -g aggressive-resize on
setw -g mode-keys vi

set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-left-length 50
set -g status-right-length 150
set -g status-keys emacs

set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

set-option -g set-clipboard on
set-option -g set-titles on
set-option -g set-titles-string '#T'
set-option -g allow-rename off

# ============================================================================
# PREFIX
# ============================================================================
set-option -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# ============================================================================
# VIM-AWARE NAVIGATION
# ============================================================================
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ============================================================================
# PANES
# ============================================================================
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind > swap-pane -D
bind < swap-pane -U

bind-key Space last-pane
bind x kill-pane
bind z resize-pane -Z
bind C-y set-window-option synchronize-panes \; display-message "Panes sync: #{?pane_synchronized,on,off}"
bind b break-pane -d
bind J command-prompt -p "join pane from:" "join-pane -s '%%'"
bind m command-prompt -p "move pane to:" "move-pane -t '%%'"

# ============================================================================
# WINDOWS
# ============================================================================
bind c new-window -c "#{pane_current_path}"
bind X kill-window
bind w choose-tree -sZ

bind -n M-H previous-window
bind -n M-L next-window
bind-key Tab next-window
bind-key s last-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n C-S-Left swap-window -t -1 \; select-window -t -1
bind -n C-S-Right swap-window -t +1 \; select-window -t +1

# ============================================================================
# SESSIONS
# ============================================================================
bind C-c new-session
bind C-f command-prompt -p find-session 'switch-client -t %%'
bind -n M-j switch-client -n
bind -n M-k switch-client -p

# ============================================================================
# COPY MODE
# ============================================================================
bind Enter copy-mode

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

bind-key -T copy-mode-vi / command-prompt -i -p "search down" "send -X search-forward-incremental \"%%%\""
bind-key -T copy-mode-vi ? command-prompt -i -p "search up" "send -X search-backward-incremental \"%%%\""
bind-key -T copy-mode-vi n send-keys -X search-again
bind-key -T copy-mode-vi N send-keys -X search-reverse

bind -T copy-mode-vi C-u send-keys -X halfpage-up
bind -T copy-mode-vi C-d send-keys -X halfpage-down
bind -T copy-mode-vi C-b send-keys -X page-up
bind -T copy-mode-vi C-f send-keys -X page-down

# ============================================================================
# CLIPBOARD
# ============================================================================
if-shell "uname | grep -q Darwin" {
  bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
  bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
  bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
  bind-key p run-shell "pbpaste | tmux load-buffer - ; tmux paste-buffer"
} {
  bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
  bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
  bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
  bind-key p run-shell "xclip -out -selection clipboard | tmux load-buffer - ; tmux paste-buffer"
}

# ============================================================================
# UTILITIES
# ============================================================================
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"
bind C-l send-keys C-l \; clear-history
bind S set-option -g status
bind P display-popup -E "lazygit"
bind = select-layout even-horizontal
bind + select-layout even-vertical
bind C-o rotate-window

# ============================================================================
# THEME
# ============================================================================
if-shell -b "[ -f \"$HOME/.config/meow/tmux/theme.conf\" ]" "source-file \"$HOME/.config/meow/tmux/theme.conf\""

# ============================================================================
# INITIALIZATION
# ============================================================================
run '~/.tmux/plugins/tpm/tpm'
